name: Build Lab tests

on:
  workflow_dispatch:
  push:
    paths:
      - "app/build-lab/**"
      - "public/build-lab-assets/**"
      - "tests/build-lab-*.test.mjs"
      - ".github/workflows/build-lab-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Build Lab tests
        run: node --test tests/build-lab-*.test.mjs
